name: Build UNSIGNED IPA (LiveContainer)

# 产出完全未签名的 IPA，专供 LiveContainer / SideStore / AltStore 导入。
# 不需要配置任何 Secrets。
#
# 触发方式：
#   1) Actions 页面手动 Run workflow
#   2) 推送 v* 标签（会额外附加到 Release，方便手机直接下载）

# 注意：本工作流不下载 Vendor/NodeMobile.framework，而当前代码依赖它，
# 因此构建会失败。请使用 .github/workflows/ios-ipa.yml（它会先下载 NodeMobile）。
# 这里仅保留手动触发，避免每次打 tag 都产生一条失败记录。
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle Identifier（留空用默认 com.tico.FlowBox）"
        required: false
        default: "com.tico.FlowBox"

jobs:
  build:
    runs-on: macos-14
    # 让内置 GITHUB_TOKEN 具备创建 Release 的权限（否则发布步骤 403）
    permissions:
      contents: write
    env:
      BUNDLE_ID: ${{ github.event.inputs.bundle_id || 'com.tico.FlowBox' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Info.plist
        run: |
          set -euxo pipefail
          # 关闭签名后 Xcode 不会自动生成 Info.plist（GenerateInfoPlist 被跳过），
          # 导致最后的 Validate 步骤找不到文件而报错。这里显式提供一个。
          cat > "$RUNNER_TEMP/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>zh_CN</string>
            <key>CFBundleDisplayName</key><string>流映</string>
            <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.entertainment</string>
            <key>UIApplicationSupportsIndirectInputEvents</key><true/>
            <key>UILaunchScreen</key><dict/>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
            <key>UISupportedInterfaceOrientations~ipad</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
              <string>UIInterfaceOrientationPortraitUpsideDown</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
            <key>NSAppTransportSecurity</key>
            <dict><key>NSAllowsArbitraryLoads</key><true/></dict>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>MinimumOSVersion</key><string>16.0</string>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/Info.plist"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no codesign)
        run: |
          set -euxo pipefail
          xcodebuild build \
            -project FlowBox.xcodeproj \
            -scheme FlowBox \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -destination "generic/platform=iOS" \
            INFOPLIST_FILE="$RUNNER_TEMP/Info.plist" \
            GENERATE_INFOPLIST_FILE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name "FlowBox.app" -type d -print -quit)
          test -n "$APP"

          # 兜底：万一 Info.plist 仍未落到 .app 内，就从备用文件补上
          if [ ! -f "$APP/Info.plist" ]; then
            cp "$RUNNER_TEMP/Info.plist" "$APP/Info.plist"
          fi
          plutil -lint "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"

          # LiveContainer 需要可执行文件保持未签名；顺便清掉 _CodeSignature
          rm -rf "$APP/_CodeSignature" "$APP/embedded.mobileprovision"

          # 校验：确认主二进制确实未签名
          if codesign -dv "$APP/FlowBox" 2>&1 | grep -q "Signature="; then
            echo "::warning::主二进制仍带签名，尝试移除"
            codesign --remove-signature "$APP/FlowBox" || true
          fi

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry FlowBox-unsigned.ipa Payload
          shasum -a 256 FlowBox-unsigned.ipa
          ls -lh FlowBox-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlowBox-unsigned-ipa
          path: ${{ runner.temp }}/FlowBox-unsigned.ipa

      - name: Publish to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/FlowBox-unsigned.ipa
          generate_release_notes: true
